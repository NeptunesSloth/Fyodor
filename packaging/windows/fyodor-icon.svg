<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Fyodor's app icon: two brass-edged cards on dark walnut, an engraved F on the front card. Original artwork. -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2717"/>
      <stop offset="1" stop-color="#160e08"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d892"/>
      <stop offset="0.45" stop-color="#c9a45c"/>
      <stop offset="1" stop-color="#7d5c25"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4a47"/>
      <stop offset="1" stop-color="#14262a"/>
    </linearGradient>
    <linearGradient id="engrave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7b0"/>
      <stop offset="1" stop-color="#c9a45c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#wood)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#c9a45c" stroke-opacity="0.35" stroke-width="3"/>
  <!-- back card -->
  <g transform="rotate(-14 128 132)">
    <rect x="66" y="44" width="116" height="164" rx="14" fill="url(#brass)"/>
    <rect x="74" y="52" width="100" height="148" rx="9" fill="#5a3b1c"/>
  </g>
  <!-- front card -->
  <g transform="rotate(6 128 132)">
    <rect x="76" y="46" width="120" height="170" rx="15" fill="#0b0705" opacity="0.45" transform="translate(4 6)"/>
    <rect x="76" y="46" width="120" height="170" rx="15" fill="url(#brass)"/>
    <rect x="85" y="55" width="102" height="152" rx="10" fill="url(#face)"/>
    <!-- engraved F: a serif capital built from bars -->
    <g fill="url(#engrave)" stroke="#0b0705" stroke-opacity="0.55" stroke-width="2.5" paint-order="stroke">
      <path d="M106 82 h62 v20 h-10 v-6 h-30 v26 h22 v-6 h8 v28 h-8 v-6 h-22 v30 h12 v12 h-42 v-12 h10 v-74 h-10 z"/>
    </g>
  </g>
</svg>
