name: Downloadable app

# Builds Fyodor as an app that needs no Python or Node: Windows by default (macOS minutes cost ten times as much on a
# private repository). Run it from the Actions tab (choose "all" for macOS and Linux too), or push a tag like v0.2.0 to
# attach the Windows zip to a GitHub release.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which apps to build"
        type: choice
        options: [windows, all]
        default: windows
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.platforms == 'all' && '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"},{"os":"ubuntu-latest","name":"linux"}]' || '[{"os":"windows-latest","name":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/build-app.sh
      - run: cd dist && python -m zipfile -c ../Fyodor-${{ matrix.name }}.zip Fyodor
      - uses: actions/upload-artifact@v4
        with:
          name: Fyodor-${{ matrix.name }}
          path: Fyodor-${{ matrix.name }}.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Fyodor-${{ matrix.name }}.zip
