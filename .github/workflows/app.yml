name: Downloadable app

# Builds Fyodor for Windows, macOS and Linux (no Python or Node needed to run it).
# Run it from the Actions tab, or push a tag like v0.2.0 to attach the zips to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: macos-latest, name: macos }
          - { os: ubuntu-latest, name: linux }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: scripts/build-app.sh
      - run: cd dist && python -m zipfile -c ../Fyodor-${{ matrix.name }}.zip Fyodor
      - uses: actions/upload-artifact@v4
        with:
          name: Fyodor-${{ matrix.name }}
          path: Fyodor-${{ matrix.name }}.zip
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Fyodor-${{ matrix.name }}.zip
